name: OS image

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.repository != 'mevensson/desktop-os' ||
      github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
    permissions:
      contents: read
    concurrency:
      group: os-validation-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/build-image.yml
    with:
      publish: false

  production:
    if: >-
      github.repository == 'mevensson/desktop-os' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name)
    permissions:
      contents: read
      packages: write
    # Serialize the whole production build/publication, including tag probes.
    # Promotion additionally checks ordering because concurrency is not FIFO.
    concurrency:
      group: os-production
      cancel-in-progress: false
    uses: ./.github/workflows/build-image.yml
    with:
      publish: true
